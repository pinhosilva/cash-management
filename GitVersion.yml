# GitVersion — versão a partir de Conventional Commits + GitFlow (§9.2).
# A versão NÃO é digitada à mão: o bump vem do tipo do commit e o canal, da branch
# (develop → -alpha, release/* → -rc, main → estável). Schema do GitVersion 6.x
# (action gittools v4): o GitFlow vem do preset `workflow`, não mais de `mode`.
workflow: GitFlow/v1
major-version-bump-message: '^(feat|fix)(\(.+\))?!:|BREAKING CHANGE:'
minor-version-bump-message: '^feat(\(.+\))?:'
patch-version-bump-message: '^fix(\(.+\))?:'
