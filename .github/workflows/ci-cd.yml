name: ci-cd

# O teste é o portão (§9.2): nada sobe sem os gates verdes. Tudo numa pipeline só —
# qualidade/segurança e os 3 gates funcionais vivem como steps do job `test`; o
# `deploy` depende dele (needs: test).
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # mínimo por padrão; cada job eleva só o que precisa

jobs:
  test: # ── o portão: segurança + unit + integração + e2e ──
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # CodeQL publica os resultados no code scanning
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GitVersion precisa do histórico completo

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Calcula a versão (branch + commits semânticos)
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Versão calculada
        run: echo "SemVer = ${{ steps.gitversion.outputs.fullSemVer }}"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # ── Segurança: secret scan (falha rápido) ──
      - name: 'Segurança — secret scan (gitleaks)'
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --config .gitleaks.toml

      # ── Segurança: SAST com CodeQL (C#, sem build — build-mode none) ──
      - name: 'Segurança — CodeQL init'
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none

      # ── Gate 1 — Unit (domínio/aplicação, sem infra) ──
      - name: 'Gate 1 — Unit · Entries'
        run: dotnet test src/CashManagement.Entries/tests/CashManagement.Entries.UnitTests/CashManagement.Entries.UnitTests.csproj -c Release
      - name: 'Gate 1 — Unit · Balance'
        run: dotnet test src/CashManagement.Balance/tests/CashManagement.Balance.UnitTests/CashManagement.Balance.UnitTests.csproj -c Release

      # ── Gate 2 — Integração (Testcontainers: SQL Server, Kafka, MongoDB reais) ──
      - name: 'Gate 2 — Integração · Entries'
        run: dotnet test src/CashManagement.Entries/tests/CashManagement.Entries.IntegrationTests/CashManagement.Entries.IntegrationTests.csproj -c Release
      - name: 'Gate 2 — Integração · Balance'
        run: dotnet test src/CashManagement.Balance/tests/CashManagement.Balance.IntegrationTests/CashManagement.Balance.IntegrationTests.csproj -c Release

      # ── Segurança: dependências vulneráveis (visibilidade; o build já gateia via NuGetAudit) ──
      - name: 'Segurança — pacotes vulneráveis (relatório)'
        run: |
          dotnet restore src/CashManagement.Entries/CashManagement.Entries.sln
          dotnet restore src/CashManagement.Balance/CashManagement.Balance.sln
          dotnet list src/CashManagement.Entries/CashManagement.Entries.sln package --vulnerable --include-transitive
          dotnet list src/CashManagement.Balance/CashManagement.Balance.sln package --vulnerable --include-transitive

      - name: 'Segurança — CodeQL analyze'
        uses: github/codeql-action/analyze@v3

      # ── Gate 3 — E2E (Newman, só a pasta Smoke contra a stack de pé) ──
      - name: Sobe a stack (compose, espera ficar healthy)
        run: docker compose up -d --build --wait

      - name: 'Gate 3 — E2E · Smoke (Newman)'
        run: >
          npx --yes newman run docs/postman/CashManagement.postman_collection.json
          -e docs/postman/CashManagement.postman_environment.json
          --folder "Smoke" --delay-request 1000

      # ── Segurança: scan das imagens construídas (CVEs corrigíveis de SO/libs) ──
      - name: 'Segurança — scan das imagens (Trivy)'
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.0
          for svc in entries-api balance-api; do
            img=$(docker compose images -q "$svc")
            echo "::group::Trivy $svc ($img)"
            trivy image --ignore-unfixed --severity CRITICAL --exit-code 1 --no-progress "$img"
            echo "::endgroup::"
          done

      - name: Derruba a stack
        if: always()
        run: docker compose down -v

  deploy: # só sobe se o portão abriu, e só nas branches de ambiente (GitFlow)
    needs: test
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a tag + release notes na main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Calcula a versão
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      # Deploy por ambiente conforme a branch (GitFlow). Placeholder: o passo real
      # (push de imagem + apply no cluster) entra quando houver ambiente provisionado.
      - name: Deploy por ambiente
        run: |
          case "${{ github.ref }}" in
            refs/heads/develop)   echo "Deploy ${{ steps.gitversion.outputs.fullSemVer }} → DEV (integração)" ;;
            refs/heads/release/*) echo "Deploy ${{ steps.gitversion.outputs.fullSemVer }} → STAGING (homologação)" ;;
            refs/heads/main)      echo "Deploy ${{ steps.gitversion.outputs.majorMinorPatch }} → PRODUÇÃO" ;;
          esac
          echo "::notice::Deploy real ainda não provisionado — passo placeholder (§9.2)."

      # Só a main estável gera a tag vX.Y.Z + release notes a partir dos commits.
      - name: Tag + release notes (só na main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.gitversion.outputs.majorMinorPatch }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag já existe — nada a fazer."
          else
            gh release create "$tag" --generate-notes --target "${{ github.sha }}"
          fi
